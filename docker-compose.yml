version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - models-cache:/root/.cache/audio-separator
      - ./backend:/app
    environment:
      - MSST_PATH=/app/msst
      - UPLOAD_DIR=/tmp/audio-separator/uploads
      - OUTPUT_DIR=/tmp/audio-separator/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend/audio-separator-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  models-cache:
